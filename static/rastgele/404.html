<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı · RastGele</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    :root{--bg:#140a18;--purple:#ad2bee;--purple-light:#d482f5;--text:#f7eefc;--white:#fff}
    body{margin:0;min-height:100vh;font-family:"Segoe UI",Arial,sans-serif;background:radial-gradient(circle at top,#3c1848 0%,#140a18 42%);color:var(--text)}
    .wrap{width:min(920px,calc(100% - 32px));margin:0 auto;padding:28px 0 64px}
    .hero{margin:36px 0 28px;padding:28px;border-radius:28px;background:#23152a;border:1px solid rgba(173,43,238,.22)}
    .kicker{color:var(--purple-light);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
    a{color:var(--purple-light)}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <p class="kicker">RastGele</p>
      <h1>Sayfa bulunamadı</h1>
      <p><a href="index.html">Hizmet Şartları</a> sayfasına dön.</p>
    </section>
  </div>
</body>
</html>
